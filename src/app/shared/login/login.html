<main class="auth-main">
  <div class="auth-card">
    <a routerLink="/" class="auth-logo">STYLE_</a>
    <h1>Log in</h1>
    <p class="auth-subtitle">Welcome back. Enter your details to continue.</p>

    <form #myForm="ngForm" (ngSubmit)="onSubmit(myForm)">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" required placeholder="Enter your email" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" required placeholder="Enter your password" />
      </div>

      @if (myError) {
      <p class="auth-error">{{ myError }}</p>
      }

      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>

    <p class="auth-footer-link">Don't have an account? <a routerLink="/signup">Sign up</a></p>
  </div>
</main>
