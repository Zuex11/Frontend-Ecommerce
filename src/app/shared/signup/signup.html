<main class="auth-main">
  <div class="auth-card">
    <a routerLink="/" class="auth-logo">STYLE_</a>
    <h1>Create account</h1>
    <p class="auth-subtitle">Fill in your details to get started.</p>

    <form #myForm="ngForm" (ngSubmit)="onSubmit(myForm)">
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First name</label>
          <input type="text" id="firstName" name="firstName" [(ngModel)]="firstName" required placeholder="First name" />
        </div>
        <div class="form-group">
          <label for="lastName">Last name</label>
          <input type="text" id="lastName" name="lastName" [(ngModel)]="lastName" required placeholder="Last name" />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" required placeholder="Enter your email" />
      </div>

      <div class="form-group">
        <label for="gender">Gender</label>
        <select id="gender" name="gender" [(ngModel)]="gender" required>
          <option value="" disabled>Select gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" required placeholder="Create a password" />
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword" required placeholder="Re-enter your password" />
      </div>

      @if (myError) {
      <p class="auth-error">{{ myError }}</p>
      }

      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>

    <p class="auth-footer-link">Already have an account? <a routerLink="/login">Log in</a></p>
  </div>
</main>
