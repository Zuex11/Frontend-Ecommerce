<main class="wrap page-body">
  <div class="section-title">
    <h1 style="font-size: 22px">Products</h1>
    <button type="button" class="btn btn-primary btn-sm" (click)="resetForm()">+ Add product</button>
  </div>

  <div class="card" style="margin-bottom: 32px">
    <table>
      <thead>
        <tr>
          <th>Product</th>
          <th>Category</th>
          <th>Price</th>
          <th>Stock</th>
          <th>Active</th>
          <th>Top sale</th>
          <th>New arrival</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (product of myProducts; track product._id) {
        <app-product-row
          [product]="product"
          (edit)="onEdit($event)"
          (toggle)="onToggle($event)"
        />
        }
      </tbody>
    </table>
  </div>

  <app-product-form [categories]="categories" [editing]="editing" (saved)="onSaved()" />
</main>
